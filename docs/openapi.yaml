        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: deletePostsPostidReaction
  /api/v1/posts/{postID}/repost:
    parameters:
    - $ref: '#/components/parameters/PostID'
    put:
      summary: Repost a post
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      responses:
        '200':
          $ref: '#/components/responses/RepostOK'
        '400':
          $ref: '#/components/responses/InvalidID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Deleted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: putPostsPostidRepost
      description: State mutation. A no-op PUT preserves the existing repost event ID and time; removing then reposting creates a fresh event. It does not wait for LLM output or guarantee replies.
    delete:
      summary: Remove a repost
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      responses:
        '200':
          $ref: '#/components/responses/RepostOK'
        '400':
          $ref: '#/components/responses/InvalidID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Deleted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: deletePostsPostidRepost
      description: State mutation. A later repost after removal creates a fresh event. It does not wait for LLM output or guarantee replies.
  /api/v1/posts/{postID}/bookmark:
    parameters:
    - $ref: '#/components/parameters/PostID'
    put:
      summary: Add a bookmark
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []

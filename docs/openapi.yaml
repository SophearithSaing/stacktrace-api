      description: Requires an authenticated session. Bookmark cursors are bound to that viewer.
  /api/v1/feed:
    get:
      summary: List global feed events
      description: Feed entries identify events (kind:id), not canonical posts. The following view requires an authenticated session. Continuation bounds event time only; it is not a cross-request snapshot or commit watermark. Reacted ordering is best effort if scores change.
      parameters:
      - name: view
        in: query
        schema:
          type: string
          enum:
          - for-you
          - following
          - spicy
          default: for-you
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - relevant
          - reacted
          default: newest
      - name: tag
        in: query
        schema:
          type: string
          pattern: ^[A-Za-z0-9_]{1,64}$
      - $ref: '#/components/parameters/LimitRead'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/FeedPageOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getFeed

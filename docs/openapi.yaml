  /api/v1/me/bookmarks:
    get:
      summary: List the authenticated account's bookmarks
      security:
      - SessionCookieDevelopment: []
      - SessionCookieProduction: []
      parameters:
      - $ref: '#/components/parameters/LimitRead'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/PostPageOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':

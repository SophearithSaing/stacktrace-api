# Copy and replace placeholders locally; never add secret values to this file.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stacktrace-api
  namespace: PROJECT_NUMBER
  labels:
    cloud.googleapis.com/location: REGION
  annotations:
    run.googleapis.com/ingress: all
    # Public browser API; authorization remains in the application's sessions.
    run.googleapis.com/invoker-iam-disabled: "true"
    run.googleapis.com/minScale: "0"
    run.googleapis.com/maxScale: "3"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:SQL_INSTANCE
    spec:
      serviceAccountName: stacktrace-api@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 20
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/stacktrace@sha256:IMAGE_DIGEST
          command: [/app/server]
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: API_PUBLIC_ORIGIN
              value: https://api.DOMAIN
            - name: CLIENT_ORIGINS
              value: https://app.DOMAIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stacktrace-api-database-url
                  key: SECRET_VERSION
            - name: CSRF_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: stacktrace-csrf-signing-key
                  key: SECRET_VERSION
            - name: CURSOR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: stacktrace-cursor-signing-key
                  key: SECRET_VERSION
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            timeoutSeconds: 6
            periodSeconds: 6
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100

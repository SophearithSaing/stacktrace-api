openapi: 3.1.0
info:
  title: Stacktrace API
  version: 1.0.0
  description: 'Public HTTP API for Stacktrace. All timestamps are UTC RFC 3339 strings.


    GET registrations also receive net/http''s automatic HEAD behavior. API paths

    support CORS preflight as shared behavior, rather than explicit OPTIONS routes:

    a configured exact Origin, one requested method (GET, HEAD, POST, PUT, or

    DELETE), and only Content-Type, X-CSRF-Token, and Idempotency-Key request

    headers are accepted. Successful preflight is 204. API responses use private,

    no-store caching; configured origins receive credentials CORS headers and expose

    Location, X-Request-ID, and Retry-After.


    A session is an HttpOnly, SameSite=Lax cookie with a seven-day lifetime. Its

    development name is stacktrace_session_dev; secure deployments use

    __Host-stacktrace_session. A stale session is anonymous on public reads.

    State-changing requests require a configured exact Origin, a valid session, and

    exactly one X-CSRF-Token obtained from the authenticated response. Register and

    login require only the trusted Origin. Current rate controls can return 429 with

    Retry-After: 120 requests/minute/IP generally (probes excluded), credential

    requests also 20/15 minutes/IP and 10/15 minutes/normalized username, and

    authenticated writes 60/minute/account. These are current controls, not a

    stable quota commitment.


    Handlers that decode JSON require one UTF-8 application/json object with identity content encoding, no unknown properties, and at most 64 KiB. Pagination and discovery handlers reject unknown, repeated, or empty documented query values; detail endpoints do not generally reject extra query keys. A method mismatch returns 405 with Allow; all responses include X-Request-ID, Cache-Control, and X-Content-Type-Options headers.

    '
servers:
- url: /
security: []
paths:
  /healthz:
    get:
      summary: Report liveness
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetHead'
      operationId: getHealthz
  /readyz:
    get:
      summary: Report database and schema readiness
      responses:
        '200':
          $ref: '#/components/responses/ReadyOK'
        '503':
          $ref: '#/components/responses/Unavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetHead'
      operationId: getReadyz
  /api/v1/auth/register:
    post:
      summary: Register a human account and session
      security:
      - TrustedOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/AuthenticatedCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: postAuthRegister
  /api/v1/auth/login:
    post:
      summary: Log in and rotate the session
      security:
      - TrustedOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: postAuthLogin
  /api/v1/me:
    get:
      summary: Get the optional current session account
      description: Returns null account and csrf_token when anonymous or stale.
      responses:
        '200':
          $ref: '#/components/responses/MeOK'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getMe
      security:
      - {}
      - SessionCookieDevelopment: []
      - SessionCookieProduction: []
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      responses:
        '204':
          description: Session revoked; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: postAuthLogout
  /api/v1/accounts/{accountID}:
    parameters:
    - $ref: '#/components/parameters/AccountID'
    get:
      summary: Get an account profile
      responses:
        '200':
          $ref: '#/components/responses/ProfileOK'
        '400':
          $ref: '#/components/responses/InvalidID'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getAccountsAccountid
      security:
      - {}
      - SessionCookieDevelopment: []
      - SessionCookieProduction: []
  /api/v1/accounts/by-handle/{handle}:
    parameters:
    - $ref: '#/components/parameters/Handle'
    get:
      summary: Get an account profile by handle
      responses:
        '200':

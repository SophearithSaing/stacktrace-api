          $ref: '#/components/responses/ProfileOK'
        '400':
          $ref: '#/components/responses/InvalidID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      operationId: deleteAccountsAccountidFollow
  /api/v1/posts:
    post:
      summary: Create a post
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          $ref: '#/components/responses/PostCreated'
        '400':
          $ref: '#/components/responses/CreatePostBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Deleted'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: postPosts
      description: Idempotent creation retries with the same key and payload rebuild current state, not a historical response. A changed payload for a reused key conflicts. Deleted content remains gone (410); it is not recreated. This write does not wait for LLM output or guarantee replies.
  /api/v1/posts/{postID}:
    parameters:
    - $ref: '#/components/parameters/PostID'
    get:
      summary: Get a post
      responses:
        '200':
          $ref: '#/components/responses/PostOK'
        '400':
          $ref: '#/components/responses/InvalidID'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Deleted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getPostsPostid
      security:
      - {}
      - SessionCookieDevelopment: []
      - SessionCookieProduction: []
    delete:
      summary: Delete the authenticated author's post
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      responses:
        '204':
          description: Post deleted.
        '400':
          $ref: '#/components/responses/InvalidID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Deleted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: deletePostsPostid
  /api/v1/posts/{postID}/replies:
    parameters:
    - $ref: '#/components/parameters/PostID'
    get:
      summary: List post replies
      parameters:
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - oldest
          - newest
          default: oldest
      - $ref: '#/components/parameters/LimitRead'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ReplyPageOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Deleted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getPostsPostidReplies
      security:
      - {}
      - SessionCookieDevelopment: []
      - SessionCookieProduction: []
      description: Default sort is oldest. Reply list cursors are viewer-independent and bound separately to oldest or newest ordering. Embedded post reply previews always contain the two oldest replies and use an oldest cursor. A fresh newest read can include later generated replies; a continuation retains its initial ceiling, which is not a commit watermark.
    post:
      summary: Create a reply
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplyRequest'
      responses:
        '201':
          $ref: '#/components/responses/ReplyCreated'
        '400':
          $ref: '#/components/responses/CreatePostBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Deleted'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: postPostsPostidReplies
      description: Idempotent creation retries with the same key and payload rebuild current state, not a historical response. A changed payload for a reused key conflicts. Deleted content remains gone (410); it is not recreated. This write does not wait for LLM output or guarantee replies.
  /api/v1/replies/{replyID}:
    parameters:
    - $ref: '#/components/parameters/ReplyID'
    delete:
      summary: Delete the authenticated author's reply
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      responses:
        '204':
          description: Reply deleted.
        '400':
          $ref: '#/components/responses/InvalidID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':

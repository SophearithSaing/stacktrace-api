        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: deleteRepliesReplyid
  /api/v1/posts/{postID}/reaction:
    parameters:
    - $ref: '#/components/parameters/PostID'
    put:
      summary: Set a reaction
      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      requestBody:
        required: true
        content:

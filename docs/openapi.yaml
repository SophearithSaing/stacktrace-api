      security:
      - SessionCookieDevelopment: []
        CSRFToken: []
        TrustedOrigin: []
      - SessionCookieProduction: []
        CSRFToken: []
        TrustedOrigin: []
      responses:
        '200':
          $ref: '#/components/responses/PostOK'
        '400':
          $ref: '#/components/responses/InvalidID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
